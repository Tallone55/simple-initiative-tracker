# Builds all four distribution archives (.deb, .tar.gz, .exe, .app)
# from a single trigger, each on its own native GitHub-hosted runner.
#
# Trigger manually from the Actions tab (or `gh workflow run
# release.yml`), or by pushing a tag starting with "v". A tag push
# also publishes the artifacts to a GitHub Release.
#
# Action versions are pinned to whichever one actually switched its
# default runtime to Node 24, not just the first with preliminary
# support. astral-sh/setup-uv is pinned to an exact version since
# that action no longer supports floating major/minor tags at all.
#
# Signing is entirely optional and off by default: each build script
# (via packaging/common/signing.sh) only signs when its own
# credential secrets are configured in this repo's Settings > Secrets
# and Actions, and skips with a clear log message otherwise, so
# nothing here breaks for a fork or clone that hasn't set any of this
# up. None of these can be generated by this workflow -- a GPG
# keypair is free to create but still has to be created and kept by a
# human; the Windows and Apple certificates specifically require a
# paid CA purchase or Apple Developer Program enrollment.
#   Linux (.deb/.tar.gz), detached GPG signature:
#     SIT_GPG_PRIVATE_KEY  -- armored private key (`gpg --export-secret-keys --armor <id>`)
#     SIT_GPG_KEY_ID       -- that key's id/fingerprint/email
#     SIT_GPG_PASSPHRASE   -- only if the key has one
#   Windows (.exe), Authenticode:
#     SIT_WINDOWS_CERT_BASE64    -- a .pfx/.p12 certificate, base64-encoded
#     SIT_WINDOWS_CERT_PASSWORD  -- that certificate's password
#   macOS (.app), Developer ID codesigning + notarization:
#     SIT_MACOS_CERT_BASE64        -- a Developer ID Application .p12, base64-encoded
#     SIT_MACOS_CERT_PASSWORD      -- that certificate's password
#     SIT_MACOS_KEYCHAIN_PASSWORD  -- password for the temporary CI keychain (any value)
#     SIT_MACOS_SIGN_IDENTITY      -- the identity string, e.g. "Developer ID Application: Name (TEAMID)"
#     SIT_MACOS_NOTARIZE_APPLE_ID, SIT_MACOS_NOTARIZE_PASSWORD (an
#       app-specific password, not the Apple ID's own), and
#       SIT_MACOS_NOTARIZE_TEAM_ID -- all three needed for
#       notarization; signing alone works without them, just with
#       Gatekeeper still warning on first launch.

name: Build release archives

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  deb-and-portable:
    name: Linux (.deb + .tar.gz)
    runs-on: ubuntu-latest
    env:
      SIT_GPG_KEY_ID: ${{ secrets.SIT_GPG_KEY_ID }}
      SIT_GPG_PASSPHRASE: ${{ secrets.SIT_GPG_PASSPHRASE }}
      SIT_GPG_PRIVATE_KEY: ${{ secrets.SIT_GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Install GTK4 + PyGObject build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 \
            libgirepository-2.0-dev libcairo2-dev pkg-config python3-dev \
            dpkg-dev gnupg librsvg2-common librsvg2-bin gir1.2-girepository-3.0
          # librsvg2-bin is build-time only, never shipped: provides
          # rsvg-convert, used by build_deb.sh to rasterize a pixmaps
          # fallback icon (see that script's own comment near
          # ICON_SRC for why it exists) -- distinct from
          # librsvg2-common just above, which is the runtime
          # GdkPixbuf loader module the built app itself depends on,
          # not a command-line tool.
          # gir1.2-girepository-3.0 is build-time only, never shipped:
          # PyGObject >= 3.52 links against libgirepository-2.0, which
          # has no separate introspectable "GIRepository" typelib of
          # its own -- PyInstaller's own GTK4/gi hook still needs to
          # introspect one named "GIRepository" version "3.0" to
          # discover what to collect for this newer architecture (see
          # packaging/build_linux_portable.sh's own header
          # comment). Confirmed directly: without it, the portable
          # build produces zero .typelib files and the app crashes on
          # startup with an unrelated-looking AttributeError, not a
          # clear error pointing at the missing package.

      - name: Import GPG signing key
        if: ${{ env.SIT_GPG_PRIVATE_KEY != '' }}
        run: echo "$SIT_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Sync project environment
        run: uv sync --extra build

      - name: Build .deb
        run: bash packaging/build_deb.sh

      - name: Build Linux portable .tar.gz
        run: bash packaging/build_linux_portable.sh

      - uses: actions/upload-artifact@v6
        with:
          name: linux-archives
          path: |
            packaging/dist/*.deb
            packaging/dist/*.deb.asc
            packaging/dist/*.tar.gz
            packaging/dist/*.tar.gz.asc

  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      SIT_WINDOWS_CERT_PASSWORD: ${{ secrets.SIT_WINDOWS_CERT_PASSWORD }}
      SIT_WINDOWS_CERT_BASE64: ${{ secrets.SIT_WINDOWS_CERT_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-gobject
            mingw-w64-x86_64-python-cairo
            mingw-w64-x86_64-adwaita-icon-theme
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-librsvg
            mingw-w64-x86_64-python-pillow
            zip
          # This job builds with packaging/build_windows.sh. The base
          # build (GTK4/PyGObject, the MSYS2-path fix, GIRepository-3.0
          # not being needed here) is confirmed functional on a real
          # GitHub Actions Windows runner. Pillow moved into this list
          # from a separate `pip install` step after that pip install
          # was confirmed, on a real run, to fail outright: PyPI has no
          # prebuilt wheel matching MSYS2's own Python ABI, so pip
          # fell back to building Pillow from source, which then
          # failed for want of its own native build toolchain --
          # `running build_clib ... [WinError 2] The system cannot
          # find the file specified`. See build_windows.sh's own
          # header comment for the full reasoning. This particular
          # fix has not itself been through a real Windows run yet --
          # treat the next one as the actual verification, same as
          # every other Windows-specific change in this script.

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Decode Authenticode certificate
        if: ${{ env.SIT_WINDOWS_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:SIT_WINDOWS_CERT_BASE64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sit-cert.pfx", $bytes)
          echo "SIT_WINDOWS_CERT_PATH=$env:RUNNER_TEMP\sit-cert.pfx" >> $env:GITHUB_ENV

      - name: Build .exe
        run: bash packaging/build_windows.sh

      - uses: actions/upload-artifact@v6
        with:
          name: windows-archive
          # A plain .zip of a onedir build, not a self-extracting
          # .exe -- see build_windows.sh's own header comment for why
          # that packaging step isn't implemented yet.
          path: packaging/dist/*.zip

  macos:
    name: macOS (.app)
    runs-on: macos-latest
    env:
      SIT_MACOS_SIGN_IDENTITY: ${{ secrets.SIT_MACOS_SIGN_IDENTITY }}
      SIT_MACOS_NOTARIZE_APPLE_ID: ${{ secrets.SIT_MACOS_NOTARIZE_APPLE_ID }}
      SIT_MACOS_NOTARIZE_PASSWORD: ${{ secrets.SIT_MACOS_NOTARIZE_PASSWORD }}
      SIT_MACOS_NOTARIZE_TEAM_ID: ${{ secrets.SIT_MACOS_NOTARIZE_TEAM_ID }}
      SIT_MACOS_CERT_BASE64: ${{ secrets.SIT_MACOS_CERT_BASE64 }}
      SIT_MACOS_CERT_PASSWORD: ${{ secrets.SIT_MACOS_CERT_PASSWORD }}
      SIT_MACOS_KEYCHAIN_PASSWORD: ${{ secrets.SIT_MACOS_KEYCHAIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Install GTK4 + PyGObject build dependencies
        # NOTE: this job builds with packaging/build_macos.sh, which
        # is UNTESTED on real macOS -- see that script's own header
        # comment. In particular, it is not confirmed whether
        # Homebrew's own PyGObject build hits the same GIRepository-3.0
        # gap the Linux build did (see the Linux job's own "Install
        # GTK4 + PyGObject build dependencies" step for what that
        # was), or whether gobject-introspection already covers it.
        run: |
          brew untap aws/tap || true
          HOMEBREW_NO_AUTO_UPDATE=1 brew install gtk4 pygobject3 gobject-introspection librsvg
          python3 -m pip install --break-system-packages pyinstaller

      - name: Import signing certificate
        if: ${{ env.SIT_MACOS_CERT_BASE64 != '' }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/sit-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/sit-cert.p12"
          echo "$SIT_MACOS_CERT_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$SIT_MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$SIT_MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$SIT_MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$SIT_MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

      - name: Build .app
        run: bash packaging/build_macos.sh

      - name: Zip the .app for upload
        run: |
          cd packaging/dist
          zip -rq "Simple Initiative Tracker.app.zip" "Simple Initiative Tracker.app"

      - uses: actions/upload-artifact@v6
        with:
          name: macos-archive
          path: packaging/dist/*.app.zip

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb-and-portable, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
