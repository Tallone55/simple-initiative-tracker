# Builds all four distribution archives (.deb, .tar.gz, .exe, .app)
# from a single trigger -- the CI equivalent of packaging/build_all.sh,
# except each format runs on its own native GitHub-hosted runner
# instead of being limited to whichever ones the local machine
# actually supports (see build_all.sh's own comment for why no single
# machine can build all four itself).
#
# Trigger manually from the Actions tab (or `gh workflow run
# release.yml`), or by pushing a tag starting with "v" (e.g. v1.0.0).
# All four artifacts are attached to the workflow run either way; a
# tag push additionally publishes them to a GitHub Release.
#
# actions/checkout, actions/upload-artifact, and actions/download-
# artifact are pinned to the specific major version each one actually
# switched its *default* runtime to Node 24 -- not just the first
# version with "preliminary" Node 24 support while still defaulting
# to the now-deprecated Node 20 (checkout@v5, upload-artifact@v6,
# download-artifact@v7 respectively). Don't downgrade these to match
# some other pin elsewhere without checking that first.

name: Build release archives

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  deb-and-portable:
    name: Linux (.deb + .tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install GTK4 + PyGObject build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 \
            libgirepository-2.0-dev libcairo2-dev pkg-config python3-dev \
            dpkg-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync project environment
        run: uv sync

      - name: Build .deb
        run: ./packaging/build_deb.sh

      - name: Build Linux portable .tar.gz
        run: ./packaging/build_linux_portable.sh

      - uses: actions/upload-artifact@v6
        with:
          name: linux-archives
          path: |
            packaging/dist/*.deb
            packaging/dist/*.tar.gz

  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-libadwaita
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-gobject
            mingw-w64-x86_64-python-cairo
            mingw-w64-x86_64-adwaita-icon-theme
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-7zip
            zip

      - name: Build .exe
        run: ./packaging/build_windows.sh

      - uses: actions/upload-artifact@v6
        with:
          name: windows-archive
          path: |
            packaging/dist/*.exe
            packaging/dist/*.zip

  macos:
    name: macOS (.app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install GTK4 + PyGObject build dependencies
        # GitHub's macOS runner images ship with aws/tap already
        # tapped, which Homebrew's newer tap-trust enforcement then
        # refuses to process during the implicit "brew update" that
        # "brew install" runs first -- untapping it here (harmless;
        # this project never uses anything from it) avoids that
        # rather than trying to individually trust it. Disabling the
        # auto-update outright is the more direct fix for the same
        # root cause (that implicit update walking every tap on the
        # runner, not just the ones this build actually needs) and
        # also makes the step faster/more deterministic.
        run: |
          brew untap aws/tap || true
          HOMEBREW_NO_AUTO_UPDATE=1 brew install gtk4 libadwaita pygobject3 gobject-introspection librsvg

      - name: Build .app
        run: ./packaging/build_macos.sh

      - name: Zip the .app for upload
        # actions/upload-artifact flattens .app bundle internals into a
        # loose file tree rather than preserving it as one item -- zipped
        # first so the download is the bundle, not its unpacked contents.
        run: |
          cd packaging/dist
          zip -rq "Simple Initiative Tracker.app.zip" "Simple Initiative Tracker.app"

      - uses: actions/upload-artifact@v6
        with:
          name: macos-archive
          path: packaging/dist/*.app.zip

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb-and-portable, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
